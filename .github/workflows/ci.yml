name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Shell syntax
        run: bash -n install.sh install-server.sh install-client.sh bootstrap.sh scripts/*.sh tests/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/oci-nsg.py
      - name: Linux builds
        run: bash ./scripts/build.sh
