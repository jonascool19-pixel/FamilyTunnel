name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web interface regressions
        run: node --check internal/app/web/app.js && node --check internal/app/web/ports.js && node scripts/test-web.cjs
      - name: Go vet
        run: go vet ./...
      - name: Shell syntax
        run: |
          for script in install.sh install-familytunnel.sh install-server.sh install-client.sh bootstrap.sh purge.sh scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Pairing code round-trip
        run: bash tests/pairing-code.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/oci-nsg.py tests/port-echo.py
      - name: OCI rule merge tests
        run: python3 tests/oci-rules.py
      - name: Real TCP and UDP through WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack wireguard-tools sqlite3 jq
          sudo bash tests/raw-tunnel.sh
      - name: Linux builds
        run: bash ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: familytunnel-linux-and-installer
          path: dist/
          if-no-files-found: error
