name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Go tests
        run: go test ./...
      - name: Race detection for controller and maintenance
        run: go test -race -timeout 180s ./internal/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web interface regressions
        run: |
          for script in internal/app/web/*.js; do node --check "$script"; done
          node tests/ui/callbacks.cjs
      - name: Go vet
        run: go vet ./...
      - name: Shell syntax
        run: |
          for script in install.sh install-familytunnel.sh install-server.sh install-client.sh bootstrap.sh purge.sh scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Pairing code round-trip
        run: bash tests/pairing-code.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: OCI rule merge tests
        run: python3 tests/oci-rules.py
      - name: Scoped Oracle account bootstrap tests
        run: python3 tests/oracle-permissions.py
      - name: Installer audit rejection tests
        run: python3 tests/test_package_audit.py
      - name: Real TCP and UDP through WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack wireguard-tools sqlite3 jq
          go test -c -o "$RUNNER_TEMP/ft-network-tests" ./internal/app
          sudo env FT_TEST_BINARY="$RUNNER_TEMP/ft-network-tests" bash tests/raw-tunnel.sh
      - name: Maintenance systemd sandbox regression (no reboot)
        run: sudo bash tests/maintenance-sandbox.sh
      - name: Linux builds
        run: bash ./scripts/build.sh
      - name: Clean installer audit
        run: python3 tests/package-audit.py dist/familytunnel-0.1.0-install.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: familytunnel-linux-and-installer
          path: dist/
          if-no-files-found: error
