name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web interface regressions
        run: node --check internal/app/web/app.js && node scripts/test-web.cjs
      - name: Go vet
        run: go vet ./...
      - name: Shell syntax
        run: bash -n install.sh install-familytunnel.sh install-server.sh install-client.sh bootstrap.sh purge.sh scripts/*.sh tests/*.sh
      - name: Pairing code round-trip
        run: bash tests/pairing-code.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/oci-nsg.py
      - name: Linux builds
        run: bash ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: familytunnel-linux-and-installer
          path: dist/
          if-no-files-found: error
